<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e"/>
      <stop offset="50%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg2)"/>
  
  <!-- Flow Lines -->
  <path d="M 160,225 L 360,225 M 440,225 L 640,225" stroke="url(#blue-stream)" stroke-width="4" filter="url(#glow2)"/>
  <path d="M 160,225 L 360,225 M 440,225 L 640,225" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,10"/>
  
  <!-- Step 1: Raw Extract Node -->
  <rect x="80" y="165" width="120" height="120" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="2" filter="url(#glow2)"/>
  <text x="140" y="215" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">EXTRACT</text>
  <text x="140" y="240" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Raw Logs / CSV</text>
  
  <!-- Step 2: SSIS Transform Node -->
  <rect x="340" y="150" width="140" height="150" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="#818cf8" stroke-width="2" filter="url(#glow2)"/>
  <text x="410" y="200" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" text-anchor="middle">SSIS ETL</text>
  <text x="410" y="225" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Data Cleansing</text>
  <text x="410" y="245" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">&amp; Star Schema</text>
  
  <!-- Step 3: Load Data Warehouse Node -->
  <rect x="600" y="165" width="130" height="120" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="2" filter="url(#glow2)"/>
  <text x="665" y="215" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">LOAD DW</text>
  <text x="665" y="240" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">SQL Server / BI</text>
  
  <!-- Top Banner Stats -->
  <rect x="50" y="40" width="310" height="70" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="70" y="68" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">500,000+ RECORDS PROCESSED</text>
  <text x="70" y="90" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">75% Reduction in Analytics Query Latency</text>
</svg>
