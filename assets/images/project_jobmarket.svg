<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c"/>
      <stop offset="50%" stop-color="#0a121c"/>
      <stop offset="100%" stop-color="#0f1c2e"/>
    </linearGradient>
    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg4)"/>
  
  <!-- Cluster Graph Connections -->
  <g stroke="rgba(20, 184, 166, 0.25)" stroke-width="1.5">
    <line x1="200" y1="200" x2="350" y2="150"/>
    <line x1="200" y1="200" x2="300" y2="300"/>
    <line x1="350" y1="150" x2="500" y2="200"/>
    <line x1="500" y1="200" x2="650" y2="160"/>
    <line x1="500" y1="200" x2="580" y2="320"/>
    <line x1="300" y1="300" x2="580" y2="320"/>
  </g>
  
  <!-- Nodes -->
  <circle cx="200" cy="200" r="22" fill="rgba(20, 184, 166, 0.2)" stroke="#14b8a6" stroke-width="2" filter="url(#glow4)"/>
  <text x="200" y="205" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">NLP</text>
  
  <circle cx="350" cy="150" r="28" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="2" filter="url(#glow4)"/>
  <text x="350" y="155" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">Scraping</text>
  
  <circle cx="500" cy="200" r="34" fill="rgba(99, 102, 241, 0.3)" stroke="#6366f1" stroke-width="2.5" filter="url(#glow4)"/>
  <text x="500" y="205" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">AI Impact</text>
  
  <circle cx="650" cy="160" r="20" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="2" filter="url(#glow4)"/>
  <text x="650" y="165" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Skills</text>
  
  <!-- Header Card -->
  <rect x="50" y="40" width="340" height="80" rx="12" fill="rgba(10, 18, 28, 0.85)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1.5"/>
  <text x="70" y="68" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">LABOR MARKET DATA SCIENCE</text>
  <text x="70" y="92" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">15,000+ Job Postings Analyzed</text>
</svg>
