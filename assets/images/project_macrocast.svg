<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09070f"/>
      <stop offset="50%" stop-color="#120c1f"/>
      <stop offset="100%" stop-color="#1a1228"/>
    </linearGradient>
    <linearGradient id="purple-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg3)"/>
  
  <!-- Axis Grid -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1">
    <line x1="100" y1="350" x2="720" y2="350"/>
    <line x1="100" y1="100" x2="100" y2="350"/>
    <line x1="100" y1="280" x2="720" y2="280"/>
    <line x1="100" y1="210" x2="720" y2="210"/>
    <line x1="100" y1="140" x2="720" y2="140"/>
  </g>
  
  <!-- Forecast Confidence Interval Polygon -->
  <polygon points="450,180 540,140 630,120 720,100 720,240 630,260 540,240 450,220" fill="rgba(168, 85, 247, 0.15)"/>
  
  <!-- Main Time Series Curve -->
  <path d="M 100,310 Q 180,260 250,290 T 400,210 T 540,180 T 720,150" fill="none" stroke="url(#purple-line)" stroke-width="4" filter="url(#glow3)"/>
  <path d="M 100,280 Q 180,310 250,260 T 400,240 T 540,220 T 720,190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>
  
  <!-- Points -->
  <circle cx="400" cy="210" r="7" fill="#a855f7" filter="url(#glow3)"/>
  <circle cx="540" cy="180" r="7" fill="#ec4899" filter="url(#glow3)"/>
  <circle cx="720" cy="150" r="8" fill="#38bdf8" filter="url(#glow3)"/>
  
  <!-- Metrics Box -->
  <rect x="120" y="40" width="320" height="90" rx="12" fill="rgba(18, 12, 31, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
  <text x="140" y="68" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">TIME SERIES FORECASTING</text>
  <text x="140" y="92" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="bold">MAPE: &lt; 3.8% (SARIMAX &amp; Prophet)</text>
  <text x="140" y="114" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">12-Month GDP &amp; Inflation Projections</text>
</svg>
