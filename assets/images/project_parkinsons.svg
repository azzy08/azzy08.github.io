<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#0f1424"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>
  
  <!-- Spiral Wave Line -->
  <path d="M 200,225 C 200,150 300,130 350,225 C 400,320 500,300 550,225 C 580,180 620,180 650,225" fill="none" stroke="url(#cyan-glow)" stroke-width="4" filter="url(#blur-glow)"/>
  <path d="M 200,225 C 220,180 260,180 300,225 C 340,270 380,270 420,225 C 460,180 500,180 540,225" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,6" opacity="0.8"/>
  
  <!-- Neural Nodes -->
  <circle cx="200" cy="225" r="8" fill="#38bdf8" filter="url(#blur-glow)"/>
  <circle cx="350" cy="225" r="10" fill="#6366f1" filter="url(#blur-glow)"/>
  <circle cx="550" cy="225" r="8" fill="#a855f7" filter="url(#blur-glow)"/>
  <circle cx="650" cy="225" r="6" fill="#38bdf8"/>
  
  <!-- Diagnostic Metrics Card Overlay -->
  <rect x="50" y="40" width="280" height="110" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <text x="70" y="72" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">CNN DEEP LEARNING MODEL</text>
  <text x="70" y="98" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold">Accuracy: 94.2%</text>
  <text x="70" y="122" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Inference Latency: &lt;150ms</text>
  
  <!-- Badge -->
  <rect x="580" y="40" width="170" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="665" y="63" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">HEALTHCARE AI</text>
</svg>
